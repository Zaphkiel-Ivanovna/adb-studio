name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🏷️ Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag must be a semantic version such as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: 📋 Show Xcode version
        run: xcodebuild -version

      - name: 🏗️ Build Release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -scheme "ADB-Studio" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: 📦 Package unsigned app
        run: ditto -c -k --keepParent "build/Build/Products/Release/ADB-Studio.app" unsigned-app.zip

      - name: 📤 Upload unsigned app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: unsigned-app.zip
          if-no-files-found: error
          retention-days: 3

  sign:
    name: 🔏 Sign & Notarize
    needs: build
    runs-on: macos-26
    environment: release
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🛠️ Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: 📥 Download unsigned app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-app

      - name: 📦 Unpack unsigned app
        run: ditto -x -k unsigned-app.zip build

      - name: 🔑 Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [ -z "${DEVELOPER_ID_CERT_P12}" ] || [ -z "${DEVELOPER_ID_CERT_PASSWORD}" ]; then
            echo "::error::DEVELOPER_ID_CERT_P12 and DEVELOPER_ID_CERT_PASSWORD secrets are required to sign the release."
            exit 1
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"

          echo -n "${DEVELOPER_ID_CERT_P12}" | base64 --decode -o "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${DEVELOPER_ID_CERT_PASSWORD}" -T /usr/bin/codesign -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" > /dev/null
          read -r -a USER_KEYCHAINS <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${USER_KEYCHAINS[@]}"
          rm -f "${CERT_PATH}"

          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk '/"Developer ID Application/ { print $2; exit }')"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::The imported certificate holds no valid 'Developer ID Application' identity."
            exit 1
          fi

          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"

      - name: 🔑 Prepare notarization key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          if [ -z "${NOTARY_API_KEY}" ] || [ -z "${NOTARY_API_KEY_ID}" ] || [ -z "${NOTARY_API_ISSUER_ID}" ]; then
            echo "::error::NOTARY_API_KEY, NOTARY_API_KEY_ID and NOTARY_API_ISSUER_ID secrets are required to notarize the release."
            exit 1
          fi

          KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_API_KEY_ID}.p8"
          printf '%s\n' "${NOTARY_API_KEY}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"

          echo "NOTARY_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: 🔏 Sign with Developer ID
        run: scripts/codesign-app.sh "build/ADB-Studio.app"

      - name: 📮 Notarize app
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/notarize.sh "build/ADB-Studio.app"

      - name: 💿 Create DMG
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          DMG_DIR="dmg-contents"
          DMG_PATH="ADB-Studio-${VERSION}.dmg"

          mkdir -p "${DMG_DIR}"
          ditto "build/ADB-Studio.app" "${DMG_DIR}/ADB-Studio.app"
          ln -s /Applications "${DMG_DIR}/Applications"

          hdiutil create -srcfolder "${DMG_DIR}" \
            -volname "ADB-Studio" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            "${DMG_PATH}"

          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_ENV"

      - name: 📮 Sign & notarize DMG
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          codesign --force --timestamp --sign "${DEVELOPER_ID_IDENTITY}" "${DMG_PATH}"
          scripts/notarize.sh "${DMG_PATH}"

      - name: 🗜️ Create ZIP
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: ditto -c -k --keepParent "build/ADB-Studio.app" "ADB-Studio-${VERSION}.zip"

      - name: 🧹 Remove signing credentials
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
          rm -f "${NOTARY_API_KEY_PATH:-}"

      - name: 📤 Upload signed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: |
            ADB-Studio-${{ needs.build.outputs.version }}.dmg
            ADB-Studio-${{ needs.build.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 3

  notes:
    name: 📝 Release Notes
    runs-on: macos-26
    environment: changelog
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛠️ Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: 📝 Generate release notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: xcrun swift scripts/changelog.swift "${TAG}" > release-notes.md

      - name: 📤 Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 3

  draft:
    name: 🎉 Draft Release
    needs: [build, sign, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Download signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release

      - name: 📥 Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: 🔐 Generate checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum "ADB-Studio-${VERSION}.dmg" "ADB-Studio-${VERSION}.zip" > checksums.txt
          cat checksums.txt

      - name: 🎉 Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          TITLE="ADB-Studio v${VERSION}"
          ASSETS=("ADB-Studio-${VERSION}.dmg" "ADB-Studio-${VERSION}.zip" checksums.txt)

          if [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2> /dev/null)" = "true" ]; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md --prerelease="${PRERELEASE}"
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --draft \
              --verify-tag \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --prerelease="${PRERELEASE}"
          fi
